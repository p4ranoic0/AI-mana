name: CI
on:
  push:
  pull_request:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6 # v0.4.1
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
      - name: Build core
        run: swift build --package-path AImana/AImanaCore
      - name: Test core
        run: swift test --package-path AImana/AImanaCore
      - name: Build relay
        run: swift build --package-path AImana/Relay
      - name: Test relay
        run: swift test --package-path AImana/Relay
      - name: Windows setup and scheduled publish
        shell: pwsh
        run: |
          swift build -c release --package-path AImana/Relay
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
          & .\.github\scripts\relay-e2e-windows.ps1
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Build core
        run: swift build --package-path AImana/AImanaCore
      - name: Test core
        run: swift test --package-path AImana/AImanaCore
      - name: Build relay
        run: swift build --package-path AImana/Relay
      - name: Test relay
        run: swift test --package-path AImana/Relay
  linux-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Secret scan
        run: python3 -I .github/scripts/scan-secrets.py --self-test && python3 -I .github/scripts/scan-secrets.py .
      - name: Linux setup and scheduled publish
        run: |
          docker run --rm -v "$PWD:/work" -w /work swift:6.1 swift build -c release --static-swift-stdlib --package-path AImana/Relay
          sudo chown -R "$(id -u):$(id -g)" AImana/Relay/.build
          relay_bin="$(find AImana/Relay/.build -type f -path '*/release/usage-relay' -print -quit)"
          test -x "$relay_bin"
          AIMANA_RELAY_BIN="$PWD/$relay_bin" bash .github/scripts/relay-e2e-linux.sh
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Test, lint and assemble
        working-directory: Android
        run: ./gradlew test lint assembleDebug
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check Xcode SDK
        run: |
          xcodebuild -version
          test "$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)" -ge 26
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test core
        run: swift test --package-path AImana/AImanaCore
      - name: Test relay
        run: swift test --package-path AImana/Relay
      - name: Generate project
        run: xcodegen generate --spec AImana/project.yml
      - name: Build iOS simulator
        run: xcodebuild -project AImana/AImana.xcodeproj -scheme AImana -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Build macOS
        run: xcodebuild -project AImana/AImana.xcodeproj -scheme AImanaMac -configuration Release -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
  desktop:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and package the tray app
        working-directory: Android
        shell: bash
        run: ./gradlew --no-daemon -PdesktopOnly=true :core:test :desktop:test :desktop:createReleaseDistributable
      - name: Smoke run (--check, no UI)
        working-directory: Android/desktop/build/compose/binaries/main-release/app/AImana
        shell: bash
        run: |
          # Decodes a known relay file with the ProGuard build: catches stripped serializers.
          sample="$GITHUB_WORKSPACE/Android/desktop/src/test/resources/relay-sample.json"
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command "\$p = Start-Process -FilePath ./AImana.exe -ArgumentList '--check','--relay-file','$sample' -Wait -PassThru -NoNewWindow -RedirectStandardOutput check.txt; Get-Content check.txt; exit \$p.ExitCode"
            out="$(cat check.txt)"
          else
            out="$(./bin/AImana --check --relay-file "$sample")"
            echo "$out"
          fi
          grep -q "Claude Code: 42%" <<< "$out"
          grep -q "OpenAI Codex: 7%" <<< "$out"

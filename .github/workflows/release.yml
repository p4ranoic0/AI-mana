name: Release usage-relay

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: compnerd/gha-setup-swift@397094e75494a93fa8d81db0268dbc8f5d6cf7c6 # v0.4.1
        with:
          swift-version: swift-6.1-release
          swift-build: 6.1-RELEASE
      - name: Build release
        run: swift build -c release --package-path AImana/Relay
      - name: Verify and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = (swift build -c release --package-path AImana/Relay --show-bin-path).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot locate release binary' }
          $binary = Join-Path $bin 'usage-relay.exe'
          $actual = (& $binary --version).Trim()
          if ($actual -notmatch '^usage-relay ([0-9]+\.[0-9]+\.[0-9]+)$') { throw "Unexpected version: $actual" }
          $version = $Matches[1]
          if ($env:GITHUB_EVENT_NAME -eq 'push' -and $version -ne $env:GITHUB_REF_NAME.TrimStart('v')) {
            throw 'Binary version does not match the release tag'
          }
          New-Item -ItemType Directory -Force package, dist | Out-Null
          Copy-Item $binary package/usage-relay.exe
          $taskBinary = Join-Path $bin 'usage-relay-task.exe'
          if (-not (Test-Path $taskBinary)) { throw 'Missing Windows scheduled-task executable' }
          Copy-Item $taskBinary package/usage-relay-task.exe
          Copy-Item LICENSE package/LICENSE
          @'
          Run .\usage-relay.exe setup from PowerShell. Then choose the published file in AI·mana on iPhone.
          Keep usage-relay.exe and usage-relay-task.exe together. The scheduled task runs without a visible console window.
          '@ | Set-Content package/README.txt
          # The Swift runtime DLLs live in the Runtimes folder on PATH, not next to swift.exe.
          $runtimeDirs = $env:PATH -split ';' | Where-Object { $_ -match '\\Swift\\Runtimes\\' -and (Test-Path $_) }
          if (-not $runtimeDirs) { throw 'Swift runtime folder not found on PATH' }
          foreach ($dir in $runtimeDirs) {
            Get-ChildItem $dir -Filter '*.dll' -File | ForEach-Object { Copy-Item $_.FullName package/ -Force }
          }
          # App-local Visual C++ runtime, so a Windows without the VC++ redistributable can run it.
          foreach ($dll in 'vcruntime140.dll', 'vcruntime140_1.dll', 'msvcp140.dll') {
            $src = Join-Path "$env:SystemRoot\System32" $dll
            if (Test-Path $src) { Copy-Item $src package/ -Force }
          }
          Get-ChildItem package -Filter '*.dll' | ForEach-Object { $_.Name } | Sort-Object | Write-Output
          $savedPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $isolated = "$(& (Resolve-Path package/usage-relay.exe) --version)".Trim()
            if ($LASTEXITCODE -ne 0 -or $isolated -ne $actual) { throw 'Packaged executable cannot run without the Swift toolchain on PATH' }
            $taskCheck = Start-Process -FilePath (Resolve-Path package/usage-relay-task.exe) -ArgumentList '--self-check' -Wait -PassThru
            if ($taskCheck.ExitCode -ne 0) { throw 'Packaged task executable cannot run without the Swift toolchain on PATH' }
          } finally { $env:PATH = $savedPath }
          Compress-Archive -Path package/* -DestinationPath "dist/usage-relay-$version-windows-x86_64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: usage-relay-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
      - name: Build installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup install failed' }
          }
          $version = (& package/usage-relay.exe --version).Trim() -replace '^usage-relay ', ''
          & $compiler "/DAppVersion=$version" Installers/windows/AImana.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
          if (-not (Test-Path "dist/AImana-$version-Setup.exe")) { throw 'Versioned installer missing' }
          Copy-Item "dist/AImana-$version-Setup.exe" dist/AImana-Setup.exe
      - name: Test installer lifecycle
        shell: pwsh
        run: ./.github/scripts/installer-e2e-windows.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: aimana-windows-installer
          path: dist/AImana*Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build universal binary
        run: swift build -c release --package-path AImana/Relay --arch arm64 --arch x86_64
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          binary="$(swift build -c release --package-path AImana/Relay --arch arm64 --arch x86_64 --show-bin-path)/usage-relay"
          archs="$(lipo -archs "$binary")"
          [[ " $archs " == *" arm64 "* && " $archs " == *" x86_64 "* ]]
          actual="$("$binary" --version)"
          [[ "$actual" =~ ^usage-relay\ [0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${actual#usage-relay }"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$version" == "${GITHUB_REF_NAME#v}" ]]
          fi
          mkdir -p package dist
          cp "$binary" package/usage-relay
          cp LICENSE package/LICENSE
          printf '%s\n' \
            'Run: ./usage-relay run --output /path/to/synced/usage-relay.json' \
            'Choose that file in AI·mana on iPhone or iPad.' \
            'This macOS binary is not notarized. If Gatekeeper blocks it, run:' \
            '  xattr -d com.apple.quarantine usage-relay' \
            'You can also build from source.' > package/README.txt
          tar -czf "dist/usage-relay-${version}-macos-universal.tar.gz" -C package usage-relay LICENSE README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: usage-relay-macos-universal
          path: dist/*.tar.gz
          if-no-files-found: error

  mac-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and package app
        run: bash .github/scripts/build-mac-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: aimana-mac-dmg
          path: dist/*.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        # Gradle downloads the platform and build tools it needs once the licenses are accepted.
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build, test, and verify signed APK
        working-directory: Android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" ]]
          keyfile="$(mktemp "${RUNNER_TEMP}/aimana-keystore.XXXXXX")"
          trap 'rm -f "$keyfile"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keyfile"
          export ANDROID_KEYSTORE_PATH="$keyfile"
          ./gradlew test testReleaseUnitTest assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          [[ -s "$apk" ]]
          version="$(sed -n 's/.*versionName = "\([0-9][0-9.]*\)".*/\1/p' app/build.gradle.kts)"
          code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' app/build.gradle.kts)"
          IFS=. read -r major minor patch <<< "$version"
          [[ "$code" -eq $((major * 10000 + minor * 100 + patch)) ]]
          relay="$(sed -n 's/.*current = "\([0-9][0-9.]*\)".*/\1/p' ../AImana/Relay/Sources/RelayKit/RelayVersion.swift)"
          [[ "$version" == "$relay" ]]
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then [[ "$version" == "${GITHUB_REF_NAME#v}" ]]; fi
          badging="$("$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/aapt" dump badging "$apk" | head -n 1)"
          [[ "$badging" == *"versionCode='$code'"* && "$badging" == *"versionName='$version'"* ]]
          apksigner="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/aimana-apk-signature.txt"
          grep -Fiq '933b6415ab3c0f0e0185212f2c3fecadaad450ab5bb77cbd7d951a22e3759dc8' "$RUNNER_TEMP/aimana-apk-signature.txt"
          mkdir -p ../dist
          cp "$apk" "../dist/AImana-$version.apk"
          cp "$apk" ../dist/AImana.apk
      - uses: actions/upload-artifact@v7
        with:
          name: aimana-android-apk
          path: dist/*.apk
          if-no-files-found: error

  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Build static Swift binary
        run: swift build -c release --package-path AImana/Relay --static-swift-stdlib
      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "${{ matrix.arch }}" ]]
          binary="$(swift build -c release --package-path AImana/Relay --static-swift-stdlib --show-bin-path)/usage-relay"
          actual="$("$binary" --version)"
          [[ "$actual" =~ ^usage-relay\ [0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${actual#usage-relay }"
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$version" == "${GITHUB_REF_NAME#v}" ]]
          fi
          mkdir -p package dist
          cp "$binary" package/usage-relay
          cp LICENSE package/LICENSE
          printf '%s\n' \
            'Run: ./usage-relay run --output /path/to/synced/usage-relay.json' \
            'Choose that file in AI·mana on iPhone or iPad.' \
            'Linux requires the system libcurl library (for Ubuntu: apt install libcurl4).' \
            'You can also build from source.' > package/README.txt
          tar -czf "dist/usage-relay-${version}-linux-${{ matrix.arch }}.tar.gz" -C package usage-relay LICENSE README.txt
      - uses: actions/upload-artifact@v7
        with:
          name: usage-relay-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: [macos, linux, windows, mac-app, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          path: dist
          merge-multiple: true
      - name: Create release with checksums and changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          cd dist
          test "$(find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" -eq 4
          test "$(find . -maxdepth 1 \( -name '*.exe' -o -name '*.dmg' -o -name '*.apk' \) | wc -l | tr -d ' ')" -eq 6
          sha256sum ./*.tar.gz ./*.zip ./*.exe ./*.dmg ./*.apk > SHA256SUMS.txt
          cd ..
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\] - " { in_section=1 }
            in_section && /^## / && $0 !~ "^## \\[" version "\\] - " { exit }
            in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            awk '/^## \[Unreleased\]/{printing=1; next} printing && /^## /{exit} printing{print}' CHANGELOG.md > release-notes.md
          fi
          test -s release-notes.md
          gh release create "$tag" dist/*.tar.gz dist/*.zip dist/*.exe dist/*.dmg dist/*.apk dist/SHA256SUMS.txt \
            --title "AI·mana $tag" --notes-file release-notes.md

notice.claude=Desativado por padrão. Ao ativar, o AI·mana lê a sessão que o Claude Code guarda na pasta .claude neste computador e chama um endpoint de uso que não é uma API pública. Os termos do Claude Code da Anthropic proíbem que apps de terceiros usem credenciais do Claude.ai. Ativar é decisão sua; o provedor não autorizou isso. O AI·mana só lê a sessão; nunca a altera nem a renova por conta própria. Se o endpoint falhar, o AI·mana usa os dados locais.
notice.codex=Desativado por padrão. Ao ativar, o AI·mana lê a sessão que o Codex guarda em a pasta .codex neste computador e chama um endpoint de uso que não é uma API pública. Os termos da OpenAI restringem o acesso programático aos seus serviços. Ativar é decisão sua; o provedor não autorizou isso. O AI·mana só lê a sessão; nunca a altera nem a renova por conta própria. Se o endpoint falhar, o AI·mana usa os dados locais.

notice.claude=Off by default. When on, AI·mana reads the session that Claude Code keeps in its .claude folder on this computer and calls a usage endpoint that is not a public API. Anthropic's Claude Code terms prohibit third-party apps from using Claude.ai credentials. Turning this on is your decision; the provider has not authorized it. AI·mana only reads the session; it never changes or renews it itself. If the endpoint fails, AI·mana uses the local data.
notice.codex=Off by default. When on, AI·mana reads the session that Codex keeps in its .codex folder on this computer and calls a usage endpoint that is not a public API. OpenAI's terms restrict programmatic access to its services. Turning this on is your decision; the provider has not authorized it. AI·mana only reads the session; it never changes or renews it itself. If the endpoint fails, AI·mana uses the local data.

notice.claude=Disattivato per impostazione predefinita. Se attivo, AI·mana legge la sessione che Claude Code salva nella sua cartella .claude su questo computer e chiama un endpoint di utilizzo che non è un’API pubblica. I termini di Claude Code di Anthropic vietano alle app di terze parti di usare le credenziali di Claude.ai. Attivarlo è una tua decisione; il fornitore non l’ha autorizzato. AI·mana legge solo la sessione; non la modifica né la rinnova mai da sé. Se l’endpoint non funziona, AI·mana usa i dati locali.
notice.codex=Disattivato per impostazione predefinita. Se attivo, AI·mana legge la sessione che Codex salva in la sua cartella .codex su questo computer e chiama un endpoint di utilizzo che non è un’API pubblica. I termini di OpenAI limitano l’accesso programmatico ai loro servizi. Attivarlo è una tua decisione; il fornitore non l’ha autorizzato. AI·mana legge solo la sessione; non la modifica né la rinnova mai da sé. Se l’endpoint non funziona, AI·mana usa i dati locali.

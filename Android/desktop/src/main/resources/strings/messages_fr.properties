notice.claude=Désactivé par défaut. Une fois activé, AI·mana lit la session que Claude Code garde dans son dossier .claude sur cet ordinateur et appelle un point d’accès d’utilisation qui n’est pas une API publique. Les conditions de Claude Code d’Anthropic interdisent aux apps tierces d’utiliser les identifiants Claude.ai. L’activer est votre décision ; le fournisseur ne l’a pas autorisé. AI·mana lit seulement la session ; il ne la modifie ni ne la renouvelle jamais lui-même. Si le point d’accès échoue, AI·mana utilise les données locales.
notice.codex=Désactivé par défaut. Une fois activé, AI·mana lit la session que Codex garde dans son dossier .codex sur cet ordinateur et appelle un point d’accès d’utilisation qui n’est pas une API publique. Les conditions d’OpenAI restreignent l’accès programmatique à leurs services. L’activer est votre décision ; le fournisseur ne l’a pas autorisé. AI·mana lit seulement la session ; il ne la modifie ni ne la renouvelle jamais lui-même. Si le point d’accès échoue, AI·mana utilise les données locales.

notice.claude=Desactivado por defecto. Al activarlo, AI·mana lee la sesión que Claude Code guarda en su carpeta .claude en esta computadora y llama a un endpoint de uso que no es una API pública. Los términos de Claude Code de Anthropic prohíben que apps de terceros usen credenciales de Claude.ai. Activarlo es tu decisión; el proveedor no lo ha autorizado. AI·mana solo lee la sesión; nunca la cambia ni la renueva por su cuenta. Si el endpoint falla, AI·mana usa los datos locales.
notice.codex=Desactivado por defecto. Al activarlo, AI·mana lee la sesión que Codex guarda en su carpeta .codex en esta computadora y llama a un endpoint de uso que no es una API pública. Los términos de OpenAI restringen el acceso programático a sus servicios. Activarlo es tu decisión; el proveedor no lo ha autorizado. AI·mana solo lee la sesión; nunca la cambia ni la renueva por su cuenta. Si el endpoint falla, AI·mana usa los datos locales.

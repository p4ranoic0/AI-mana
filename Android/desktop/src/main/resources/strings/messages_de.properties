notice.claude=Standardmäßig aus. Wenn aktiviert, liest AI·mana die Sitzung, die Claude Code in seinem Ordner .claude auf diesem Computer speichert, und ruft einen Nutzungsendpunkt auf, der keine öffentliche API ist. Die Claude-Code-Bedingungen von Anthropic verbieten Drittanbieter-Apps, Claude.ai-Zugangsdaten zu verwenden. Die Aktivierung ist deine Entscheidung; der Anbieter hat sie nicht genehmigt. AI·mana liest die Sitzung nur; es ändert oder erneuert sie nie selbst. Wenn der Endpunkt ausfällt, nutzt AI·mana die lokalen Daten.
notice.codex=Standardmäßig aus. Wenn aktiviert, liest AI·mana die Sitzung, die Codex in seinem Ordner .codex auf diesem Computer speichert, und ruft einen Nutzungsendpunkt auf, der keine öffentliche API ist. Die Bedingungen von OpenAI beschränken den programmatischen Zugriff auf ihre Dienste. Die Aktivierung ist deine Entscheidung; der Anbieter hat sie nicht genehmigt. AI·mana liest die Sitzung nur; es ändert oder erneuert sie nie selbst. Wenn der Endpunkt ausfällt, nutzt AI·mana die lokalen Daten.
